<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
        }

        a:visited{
            color: blue;
        }

        a:hover{
            color: darkred;
            text-decoration: underline;
        }
        a::after{
            content: '[Link]';
            text-decoration: none;
            color: rgb(195, 197, 199);
        }
        .especial{
            background-color: lightcoral;
        }

        .especial::before{
            content: '->';
        }
        .especial::after{
            content: '<-';
        }

        /*
                : = pseudo clase
                :: = pseudo elemento
                > = filho

        */

    </style>
    <title>Links</title>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li>
            <a href="https://gustavoguanabara.github.io" rel="external" target="_blank" class="especial">
                Repositorio GitHub
            </a>
        </li>
        <li>
            <a href="https://youtube.com/cursoemvideo/" target="_blank">
                Canal do youtube
            </a>
        </li>
        <li>
            <a href="https://www.cursoemvideo.com" target="_blank">
                Site do CEV
            </a>
        </li>
    </ul>
</body>
</html>
