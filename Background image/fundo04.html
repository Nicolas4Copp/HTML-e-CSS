<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento vertical</title>
    <style>
        #container{
            height: 96vh;
            background-color: purple;
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            padding: 10px;
            position: relative;
        }
        #conteudo{
            height: 200px;
            background-color: yellow;
            background-image: url(imagens/target001.png);
            background-size: 100% 100%;
            width: 400px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%,  -50%);
        }
        #teste{
            height: 30px;
            width: 50px;
            background-color: blue;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <section id="container">
        <article id="conteudo">
            <div id="teste"></div>
        </article>
    </section>
</body>
</html>
