<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas em HTML</title>
    <style>

        table{
            width: 400px;
            height: 400px;
            border-collapse:collapse;
        }

        tr#azul{
            background-color: rgb(26, 132, 225);
        }

        td{
            padding: 8px;
            border: 1px solid black;
            text-align: center;
        }

        td#rosa{
            vertical-align: top;
            padding: 8px;
            border: 1px solid black;
            background-color: pink;
        }

        td#midle{
            vertical-align: middle;
        }

        td#bottom{
            vertical-align: bottom;
        }

    </style>
</head>
<body>
    <h1>Uma tabela</h1>
    <!--
        HIERARQUIA DE TABELAS (simples)
            table = tabela
                table row = linha de tabela
                    table header = cabeçalho de tabela
                    table data = dados da tabela
    -->
    <table>
        <tr>
            <td>A1</td>
            <td id="rosa">A2</td>
            <td>A3</td>
        </tr>
        <tr>
            <td>B1</td>
            <td id="midle">B2</td>
            <td>B3</td>
        </tr>
        <tr id="azul">
            <td>C1</td>
            <td id="bottom">C2</td>
            <td>C3</td>
        </tr>
    </table>
</body>
</html>
